name: Build OpenBLOX PS2

on:
  push:
    branches: [Complete-Rework]
  pull_request:
    branches: [Complete-Rework]
  workflow_dispatch:

jobs:
  build-ps2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build inside PS2 Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project/C_Engine \
            ps2dev/ps2dev:latest \
            make ps2

      - name: Verificar ELF
        run: |
          ls -R C_Engine || true

      - name: Upload OpenBLOX PS2
        uses: actions/upload-artifact@v4
        with:
          name: OpenBLOX_PS2
          path: C_Engine/openblox_ps2.elf
