name: Build OpenBLOX PS2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar ps2toolchain-ee
        run: |
          git clone https://github.com/ps2dev/ps2toolchain.git

      - name: Instalar toolchain
        run: |
          cd ps2toolchain-ee
          chmod +x toolchain.sh
          ./toolchain.sh

      - name: Compilar
        run: |
          cd C_Engine
          make ps2
