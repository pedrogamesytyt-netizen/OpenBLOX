name: Build OpenBLOX PS2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Verificar Ambiente
        run: |
          echo "=== PATH ==="
          echo $PATH

          echo "=== Procurando ee-gcc ==="
          which ee-gcc || true
          find / -name ee-gcc 2>/dev/null || true

          echo "=== Variáveis ==="
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          echo $PS2DEV
          echo $PS2SDK

      - name: Compilar
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin

          cd C_Engine
          make ps2

      - name: Enviar ELF
        uses: actions/upload-artifact@v4
        with:
          name: OpenBLOX_PS2
          path: C_Engine/openblox_ps2.elf
