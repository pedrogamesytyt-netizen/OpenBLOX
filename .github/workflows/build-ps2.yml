name: Build OpenBLOX PS2


on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v3

      - name: Instalar Compilador PS2
        run: |
          # Adiciona o repositório necessário e instala as ferramentas de compilação
          sudo apt-get update
          sudo apt-get install -y make git gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu
          
          # Nota: O projeto OpenBLOX pode exigir dependências extras do PS2SDK
          # Esta é uma estrutura básica para compilação.

      - name: Compilar ELF
        run: |
          cd C_Engine
          make ps2

      - name: Enviar ELF Gerado
        uses: actions/upload-artifact@v4
        with:
          name: openblox_ps2_elf
          path: C_Engine/*.elf
          
