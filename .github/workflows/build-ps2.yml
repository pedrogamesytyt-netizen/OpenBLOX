name: Build OpenBLOX PS2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Instalar Dependencias
        run: |
          apt-get update && apt-get install -y make

      - name: Baixar Codigo
        uses: actions/checkout@v3

      - name: Compilar ELF
        run: |
          cd C_Engine
          make ps2

      - name: Enviar ELF Gerado
        uses: actions/upload-artifact@v4
        with:
          name: openblox_ps2_elf
          path: C_Engine/*.elf
          
